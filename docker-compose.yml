services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sponsora_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sponsora
      DB_USERNAME: root
      DB_PASSWORD: root
    networks:
      - sponsora_network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: sponsora_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sponsora_network
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: sponsora_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sponsora
    volumes:
      - sponsora_db_data:/var/lib/mysql
    networks:
      - sponsora_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sponsora_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - sponsora_network
    depends_on:
      - db

networks:
  sponsora_network:
    driver: bridge

volumes:
  sponsora_db_data:
    driver: local